[build-system]
build-backend = "setuptools.build_meta"

requires = [ "setuptools>=80", "setuptools-scm>=8" ]

[project]
name = "pydft-qmmm"
description = "PyDFT-QMMM: A Python Package for Performing QM/MM Simulations"
readme = "README.md"
license = "LGPL-2.1"
license-files = [ "LICENSE", "COPYING", "COPYING.LESSER" ]
authors = [
  { name = "John P. Pederson", email = "johnppederson@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 5 - Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]

dynamic = [ "version" ]
dependencies = [ "numpy", "openmm", "pint", "qcelemental" ]
optional-dependencies.arbitrary-topologies = [ "parmed" ]
optional-dependencies.dev = [ "pre-commit" ]
optional-dependencies.docs = [ "furo", "sphinx", "sphinx-autodoc-typehints" ]
optional-dependencies.enhanced-sampling = [ "plumed" ]
optional-dependencies.pyscf = [ "pyscf>=2.14" ]
optional-dependencies.qmmm-pme = [ "helpme-py" ]
optional-dependencies.tests = [ "pytest", "pytest-cov" ]
urls.Documentation = "https://johnppederson.com/pydft-qmmm/"
urls.Issues = "https://github.com/johnppederson/pydft-qmmm/issues"
urls.Repository = "https://github.com/johnppederson/pydft-qmmm.git"
scripts.pydft-qmmm = "pydft_qmmm.__main__:main"

[tool.setuptools]
packages = [ "pydft_qmmm" ]

[tool.setuptools_scm]

[tool.mypy]
ignore_missing_imports = true
exclude = [ "__main__.py" ]

[tool.pytest.ini_options]
markers = [
  "slow: runs an SCF; submit with sbatch, not on the login node",
]
